name: Sync Articles & Build

on:
  # 定时：每天 23:00（北京时间）运行一次。GitHub Actions 使用 UTC，UTC 15:00 = 北京时间 23:00
  schedule:
    - cron: '0 15 * * *'
  # 手动触发（在 GitHub 网页上点 Run workflow）
  workflow_dispatch:
  # 后台发文即时触发（通过 GitHub API 调用 repository_dispatch）
  repository_dispatch:
    types: [article-published]

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch articles from cloud
        run: node scripts/fetch-articles.mjs

      - name: Build VuePress
        run: npm run docs:build

      - name: Deploy dist to master branch
        run: |
          # 克隆 master 分支到临时目录
          DEPLOY_DIR=$(mktemp -d)
          git clone --single-branch --branch master https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/chenzk14/vuepress.git "$DEPLOY_DIR"
          # 同步 dist 内容（排除 .git）
          rsync -a --delete --exclude='.git' dist/ "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          # 在临时目录里设置 git 身份（否则 commit 会因 empty ident 失败）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "sync: update site $(date -u +'%Y-%m-%d %H:%M')" || echo "no changes"
          git push origin master
